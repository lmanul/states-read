<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>States Read</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: Arial;
        height: 100vh;
        margin: 0;
        padding: 1ex;
      }
      #main {
        display: flex;
        flex-direction: row;
        flex-grow: 1;
        gap: 3ex;
      }
      #map-container {
        background-color: #eee;
        display: flex;
        flex-direction: column;
        flex-basis: 75%;
        padding: 1ex;
        text-align: center;
        width: 100%;
      }
      #header {
        flex-grow: 0;
      }
      #header h1 {
        text-align: center;
      }
      #controls {
        flex-grow: 0;
      }
      #map {
        flex-grow: 0;
      }
      #map svg {
      }
      #footer {
        flex-grow: 0;
      }
      .hover {
        fill: #ffdd4d !important;
      }
      .highlight {
        fill: #777 !important;
      }
      #details {
        background-color: #eee;
        flex-basis: 50%;
        padding: 1ex;
      }
      #popup {
        background-color: white;
        border: 1px solid #222;
        box-shadow: 12px 12px 18px rgba(0, 0, 0, 0.3);
        display: none;
        position: fixed;
        padding: 1.5ex;
        text-align: center;
        z-index: 20;
      }
      .pill {
        border: 1px solid rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        cursor: pointer;
        display: inline-block;
        margin: 1px;
        padding: 5px;
      }
      .assessment-pill {
        background-color: #eee;
      }
      .state-pill {
        background-color: #5fe97c;
      }
      .assessment-pill {
        background-color: #83b6ff;
      }
      .program-pill {
        background-color: #ffb5b5;
      }
      .program-pill:hover {
        background-color: #ef7572;
      }
      .assessment-pill:hover {
        background-color: #4885de;
      }
      .assessment {
        color: #1a51af;
      }
      .program {
        color: #800f0c;
      }
    </style>
    <script src="statesread.js"></script>
  </head>
  <body onload="onMapLoad()">
    <div id="header">
      <h1>States Read</h1>
    </div>
    <div id="main">
      <div id="map-container">
        <div id="map">Loading...</div>
        <div id="controls">
          <button onclick="clearStateHighlights()">Clear</button>
        </div>
        <div id="popup"></div>
      </div>
      <div id="details"></div>
    </div>
    <div id="footer">
      <div id="legend">
        <h1>Legend</h1>
        <div class="pill state-pill">State</div>
        <div class="pill assessment-pill">Assessment</div>
        <div class="pill program-pill">Program</div>
      </div>
    </div>
  </body>
</html>
