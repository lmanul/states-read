<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>States Read</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: row;
        font-family: Arial;
        gap: 3ex;
      }
      #map {
        flex-basis: 50%;
        height: 80vh;
        text-align: center;
        width: 100%;
      }
      #map svg {
      }
      .highlight {
        fill: #999 !important;
      }
      #details {
        flex-basis: 50%;
      }
      #popup {
        background-color: white;
        border: 1px solid #222;
        box-shadow: 12px 12px 18px rgba(0, 0, 0, 0.3);
        display: none;
        position: fixed;
        padding: 1.5ex;
        text-align: center;
        z-index: 20;
      }
      .assessment-pill {
        background-color: #eee;
        cursor: pointer;
        display: inline-block;
        border: 1px solid rgba(0, 0, 0, 0.5);
        padding: 5px;
      }
      .assessment-pill:hover {
        background-color: #83b6ff;
      }
      </style>
    <script src="statesread.js"></script>
  </head>
  <body onload="onMapLoad()">
    <div id="map">Loading...</div>
    <div id="details"></div>
    <div id="popup"></div>
  </body>
</html>
